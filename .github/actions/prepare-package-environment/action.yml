name: prepare-environment
description: Prepares the packaging environment
runs:
  using: "composite"
  steps:
    - name: Prepare environment
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/build"
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
           tar \
           wget \
           cmake \
           buildah \
           ninja-build \
           clang \
           clang-tidy \
           pkg-config \
           build-essential
      shell: bash

