name: AQMS Duty Review Backend Application
run-name: Pipeline for branch ${{ github.ref_name }}

on:
  push:
    branches: [main]
  schedule:
    - cron: '18 9 * * *'
  # A manual trigger, for when the registry was down rather than the code
  # being wrong.
  workflow_dispatch:
  #pull_request:
  #  branches: [main]

# One pipeline at a time.  Not cancel-in-progress: a run that is already
# pushing should finish rather than leave a tag half-written.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: MLReviewBackend
  CONTAINER_NAME: mlreviewbackend
  QUAY_DIRECTORY: mlreviewbackend
  BUILD_TYPE: Release
  CXX: g++
  CC: gcc

jobs:
  build:
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-24.04]
        arch: [x86]
        BUILD_TARGET: [Release]
    name: Build for ${{ matrix.distro }} ${{ matrix.arch }}
    permissions:
      contents: read
      packages: read
    # All third-party dependencies are baked into this image; see
    # scripts/Dockerfile.u24 and .github/workflows/base-image.yaml.
    # (The env context is not available here, hence no ${{ env.* }}.)
    container:
      image: ghcr.io/${{ github.repository_owner }}/mlreviewbackend-base:ubuntu24
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # The job runs as root but the workspace is owned by the runner user,
      # so git (used by CMake for the version tag) refuses the repo otherwise.
      - name: Trust the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # The base image only has static mongocxx/libmseed, hence no shared libs.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=ON

      - name: Build
        run: |
           cmake --build build --parallel
           ldd build/mlReviewBackend
           cp include/mlReview/version.hpp build

      - name: Test install
        run: 
           cmake --install build

      - name: Upload build directory
        uses: ./.github/actions/upload-build-directory

  test:
    needs: build
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-24.04]
        arch: [x86]
    name: Test on ${{ matrix.distro }} ${{ matrix.arch }}
    permissions:
      contents: read
      packages: read
    # Same image as the build job: the build directory records absolute
    # paths from inside the container (/__w/...), so ctest only finds the
    # test executables if it runs in the container too.
    container:
      image: ghcr.io/${{ github.repository_owner }}/mlreviewbackend-base:ubuntu24
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-environment

      - name: Download build directory
        uses: ./.github/actions/download-build-directory

      - name: Run unit tests for release
        run: ctest --test-dir build --output-on-failure

  package:
    needs: test
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-24.04]
        arch: [x86]
        BUILD_TARGET: [Release]
    name: Package for ${{ matrix.distro }} ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare package environment
        uses: ./.github/actions/prepare-package-environment

      - name: Download build directory
        uses: ./.github/actions/download-build-directory

      - name: Package tgz
        working-directory: ${{github.workspace}}
        run: |
          mv build/version.hpp include/mlReview/
          cd build/
          mkdir -p artifacts
          cpack -B artifacts TGZ

      - name: Build and push image
        env: # Or as an environment variable
          QUAY_ROBOT_PASSWORD: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          QUAY_ROBOT_USER: ${{ secrets.QUAY_ROBOT_USER }}
        working-directory: ${{github.workspace}}
        run: |
          echo $QUAY_ROBOT_PASSWORD | buildah login -u $QUAY_ROBOT_USER --password-stdin quay.io
          cd build/Release
          cp artifacts/*tar.gz ./
          version=$(ls *tar.gz | sed 's/MLReviewBackend-//g' | sed 's/-Linux.tar.gz//g')
          echo "Will build container version ${version}"
          buildah bud -t ${CONTAINER_NAME}:${version} -t ${CONTAINER_NAME}:latest -f ./Dockerfile.u26
          dated="${version}-$(date -u +%Y%m%d)"
          buildah tag ${CONTAINER_NAME}:${version} quay.io/uuss/${QUAY_DIRECTORY}:${version}
          buildah tag ${CONTAINER_NAME}:${version} quay.io/uuss/${QUAY_DIRECTORY}:${dated}
          push_tag() {
            for i in 1 2 3; do
              buildah push "$1" && return 0
              echo "Push of $1 failed (attempt $i); retrying"
              sleep 15
            done
            echo "ERROR: could not push $1 after 3 attempts"
            return 1
          }
          push_tag quay.io/uuss/${QUAY_DIRECTORY}:${version}
          push_tag quay.io/uuss/${QUAY_DIRECTORY}:${dated}

